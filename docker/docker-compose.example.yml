version: '3.8'

services:
  synapsenote-web:
    image: synapsenote/web:latest
    ports:
      - "80:80"
    environment:
      # REQUIRED: Configure these to match your SynapseNote backend URLs
      # The container will fail to start if these are not set
      - SYNAPSENOTE_BASE_URL=https://your-backend.example.com
      - SYNAPSENOTE_GOTRUE_BASE_URL=https://your-backend.example.com/gotrue
      - SYNAPSENOTE_WS_BASE_URL=wss://your-backend.example.com/ws/v2
    restart: unless-stopped
