# Install as /etc/nginx/conf.d/10-connection-upgrade.conf
#
# `map` is only valid in the `http{}` block, which is why this cannot live in
# the server block next door. It sends `Connection: upgrade` only for requests
# that actually asked to upgrade; a blanket `Connection: upgrade` on every
# proxied request defeats keepalive to the upstream.
#
# Skip this file if the host already defines `$connection_upgrade` — nginx
# refuses to start on a duplicate map.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
