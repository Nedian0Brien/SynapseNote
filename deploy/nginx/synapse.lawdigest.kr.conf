# nginx server block for the SynapseNote server.
#
# Install as /etc/nginx/sites-available/synapse.lawdigest.kr and link it into
# sites-enabled. Requires the `$connection_upgrade` map — see
# deploy/nginx/10-connection-upgrade.conf.
#
# Written for nginx 1.18 (Ubuntu 22.04), which takes `http2` as a `listen`
# parameter; the separate `http2 on;` directive only exists from 1.25.1.

upstream synapsenote {
    # Must match SYNAPSENOTE_HOST_PORT in deploy/compose.yml (default 8080).
    # On a host that already has 8080 spoken for, change both together.
    server 127.0.0.1:18081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name synapse.lawdigest.kr;

    access_log /var/log/nginx/synapse.lawdigest.kr.access.log;
    error_log /var/log/nginx/synapse.lawdigest.kr.error.log;

    # Leave the ACME path on plain HTTP so certificate renewal keeps working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synapse.lawdigest.kr;

    access_log /var/log/nginx/synapse.lawdigest.kr.access.log;
    error_log /var/log/nginx/synapse.lawdigest.kr.error.log;

    ssl_certificate /etc/letsencrypt/live/synapse.lawdigest.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapse.lawdigest.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Documents carry images and attachments; the default 1m rejects ordinary
    # uploads with a 413 the app cannot explain.
    client_max_body_size 100m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml font/ttf font/otf
               image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        proxy_pass http://synapsenote;
        proxy_http_version 1.1;

        # Load-bearing, not boilerplate.
        #
        # Host: the server matches this against OK_PUBLIC_ORIGIN's hostname.
        # nginx's default is the upstream name, which would make every request
        # arrive as `synapsenote` and be refused with host-not-allowed.
        proxy_set_header Host $host;

        # X-Forwarded-For: appends the client to any existing chain. The server
        # runs with OK_TRUSTED_PROXY_HOPS=1 and counts one entry from the
        # right, so this line is what makes the client address real. Anything a
        # client sent stays to the left, where it is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: decides the `Secure` attribute on the session
        # cookie. Get it wrong and the browser silently drops the cookie, so
        # sign-in appears to succeed and never sticks.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket upgrade for /collab and /collab/keepalive. Without these,
        # the editor loads and never syncs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A collab socket is idle whenever the user is reading rather than
        # typing. The 60s default would cut it every minute and the client
        # would reconnect in a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # /mcp streams responses. Buffering them would hold a tool result until
        # the stream ended, which for a long-running call is indistinguishable
        # from a hang.
        proxy_buffering off;
    }
}
