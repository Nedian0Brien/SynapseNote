# nginx server block for the SynapseNote server.
#
# Replaces whatever currently serves synapse.lawdigest.kr. Install as
# /etc/nginx/sites-available/synapse.lawdigest.kr, link it into sites-enabled,
# and remove the link for the block it replaces.
#
# The certificate paths assume the existing certbot setup already holds a
# certificate for this name. `certbot --nginx` will rewrite these lines itself
# if you let it manage the file; check them after it does.

upstream synapsenote {
    # Matches the loopback publish in deploy/compose.yml.
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name synapse.lawdigest.kr;

    # Leave the ACME path on plain HTTP so certificate renewal keeps working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name synapse.lawdigest.kr;

    ssl_certificate     /etc/letsencrypt/live/synapse.lawdigest.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapse.lawdigest.kr/privkey.pem;

    # Documents carry images and attachments; the default 1m rejects ordinary
    # uploads with a 413 the app cannot explain.
    client_max_body_size 100m;

    location / {
        proxy_pass http://synapsenote;
        proxy_http_version 1.1;

        # Load-bearing, not boilerplate.
        #
        # Host: the server matches this against OK_PUBLIC_ORIGIN's hostname.
        # nginx's default is the upstream name, which would make every request
        # arrive as `synapsenote` and be refused with host-not-allowed.
        proxy_set_header Host $host;

        # X-Forwarded-For: appends the client to any existing chain. The server
        # is configured with OK_TRUSTED_PROXY_HOPS=1 and counts one entry from
        # the right, so this line is what makes the client address real. Any
        # value a client sent stays to the left, where it is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: decides the `Secure` attribute on the session
        # cookie. Get it wrong and the browser silently drops the cookie, so
        # sign-in appears to succeed and never sticks.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket upgrade for /collab and /collab/keepalive. Without these,
        # the editor loads and never syncs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A collab socket is idle whenever the user is reading rather than
        # typing. The 60s default would cut it every minute and the client
        # would reconnect in a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # /mcp streams responses. Buffering them would hold a tool result until
        # the stream ended, which for a long-running call is indistinguishable
        # from a hang.
        proxy_buffering off;
    }
}

# `Connection: upgrade` only when the client asked for it — a bare
# `Connection: upgrade` on every request breaks keepalive to the upstream.
# Put this in the http{} block (e.g. /etc/nginx/conf.d/upgrade-map.conf) if it
# is not already defined; it cannot live inside server{}.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
