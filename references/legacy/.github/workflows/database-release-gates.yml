name: Database release gates

on:
  pull_request:
    paths:
      - ".github/workflows/database-release-gates.yml"
      - "packages/core/src/database/**"
      - "packages/server/src/database-*.ts"
      - "packages/server/src/mcp/**/database*.ts"
      - "packages/app/src/components/Database*.tsx"
      - "packages/app/src/editor/components/Database*.tsx"
      - "packages/app/src/lib/database-*.ts"
      - "packages/app/tests/stress/database-*.e2e.ts"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUN_INSTALL_CACHE_DIR: ~/.bun/install/cache

jobs:
  accessibility-ui:
    name: Database UI accessibility and mutation DOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused database DOM gates
        run: >-
          bun run --cwd packages/app test:dom
          src/components/DatabaseCreationDialog.dom.test.tsx
          src/components/DatabaseDiagnosticsDialog.test.tsx
          src/components/DatabaseTableDialog.dom.test.tsx
          src/components/DatabaseViewManagerDialog.dom.test.tsx
          src/editor/components/DatabaseView.dom.test.tsx

  engine-release-gates:
    name: Database security, performance, migration, and recovery gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused core invariants and migration gates
        run: >-
          bun test --timeout 60000 --conditions development
          packages/core/src/database/property-invariants.test.ts
          packages/core/src/database/migration.test.ts
          packages/core/src/database/interchange.test.ts
          packages/core/src/database/transaction.test.ts
          packages/core/src/database/record-repair.test.ts
      - name: Run focused server security and recovery gates
        run: >-
          bun test --cwd packages/server --timeout 60000 --conditions development
          src/database-access-policy.test.ts
          src/database-resource-regression.test.ts
          src/database-permission-store.test.ts
          src/database-markdown-import.test.ts
          src/database-git-recovery.test.ts
          src/database-conflict-races.test.ts
          src/database-task-rollback.test.ts
          src/database-commit.test.ts
      - name: Run held-out discovery and retrieval evals
        run: >-
          bun test --cwd packages/server --timeout 60000 --conditions development
          src/database-discovery-eval.test.ts
          src/database-retrieval-eval.test.ts
          src/database-creation-eval.test.ts
          src/database-final-eval.test.ts
      - name: Run bounded performance benchmarks
        run: >-
          bun test --cwd packages/server --timeout 60000 --conditions development
          src/database-performance-benchmark.test.ts
          src/database-lifecycle-benchmark.test.ts
