name: Database determinism

on:
  pull_request:
    paths:
      - '.github/workflows/database-determinism.yml'
      - 'packages/core/src/database/**'
      - 'packages/core/src/index.ts'
      - 'packages/app/src/lib/database-*-conformance.test.ts'
      - 'packages/app/src/lib/database-query-client.ts'
      - 'packages/server/src/database-*-conformance.test.ts'
      - 'packages/server/src/database-api-mcp-contract.test.ts'
      - 'packages/server/src/database-data-plane.ts'
      - 'packages/desktop/src/main/database-determinism-conformance.test.ts'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  golden-vectors:
    name: ${{ matrix.os }} query and Formula vectors
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared query and Formula golden vectors
        run: >-
          bun test --timeout 30000 --conditions development
          packages/core/src/database/query-conformance.test.ts
          packages/core/src/database/formula-conformance.test.ts
          packages/app/src/lib/database-query-client.test.ts
          packages/app/src/lib/database-formula-conformance.test.ts
          packages/server/src/database-api-mcp-contract.test.ts
          packages/server/src/database-formula-conformance.test.ts
          packages/desktop/src/main/database-determinism-conformance.test.ts
