[package]
name = "yrs-ffi"
version = "0.0.0"
edition = "2021"
publish = false
description = "Minimal UniFFI surface over yrs for the native editor spike"

[lib]
name = "yrs_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Pinned to the versions checked on crates.io on 2026-09-28.
yrs = { version = "=0.28.0", features = ["sync"] }
thiserror = "2"
uniffi = { version = "=0.32.2", features = ["cli"] }
