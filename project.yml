name: SynapseNote
options:
  bundleIdPrefix: com.synapsenote
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SynapseNote:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      # built by scripts/build-editor.sh in the pre-build script below
      - path: App/Resources/Editor
        type: folder
        buildPhase: resources
        # missing in a fresh clone until the first build creates it
        optional: true
    info:
      path: App/Info.plist
      properties:
        UIFileSharingEnabled: true
        # sync between the person's own devices on the same network, see App/Sources/Sync
        NSLocalNetworkUsageDescription: SynapseNote finds your other devices on this network to keep your vault the same on them.
        NSBonjourServices: [_synapsenote-sync._tcp]
        # requests to paired devices go to their local address over http, each one encrypted by the app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: Build editor bundle
        script: '"$SRCROOT/scripts/build-editor.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: SynapseNote
        # signed to run locally until a development team is chosen
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.synapsenote.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SynapseNote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # one window on iPadOS too, for the same single editor page
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        # sandbox, network client for WebKit, the picked vault folder and its bookmark, see the file
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/SynapseNote-macOS.entitlements
        # the app's own documents folder is a vault the Files app shows (UIFileSharingEnabled is in App/Info.plist,
        # it has no INFOPLIST_KEY_ build setting)
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ENABLE_HARDENED_RUNTIME: YES
        # the pre-build script writes the bundle into the source tree
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  SynapseNoteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Tests
    dependencies:
      - target: SynapseNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synapsenote.native.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SynapseNote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SynapseNote"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SynapseNote.app/Contents/MacOS/SynapseNote"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/SynapseNote.app/SynapseNote"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SynapseNote:
    build:
      targets:
        SynapseNote: all
        SynapseNoteTests: [test]
    test:
      targets:
        - SynapseNoteTests
